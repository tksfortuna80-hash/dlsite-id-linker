<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>DLsite ID Linker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>DLsite ID Linker</h1>
    <label class="switch" title="拡張機能全体のON/OFF">
      <input type="checkbox" id="enabled">
      <span class="slider" aria-hidden="true"></span>
      <span class="visually-hidden">拡張機能を有効にする</span>
    </label>
  </header>

  <main id="main">
    <p class="section-title">リンク化するフロア</p>
    <!-- departments.js の定義から popup.js が生成する -->
    <ul id="departments" class="departments"></ul>
    <p id="status" class="status" role="status"></p>
  </main>

  <script src="../src/departments.js"></script>
  <script src="../src/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
